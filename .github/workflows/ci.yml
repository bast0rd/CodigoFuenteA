name: CI + SonarQube

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Backend - instalar y probar
        working-directory: BACKEND
        run: |
          npm ci --ignore-scripts
          npm test

      - name: Frontend - instalar, lint y build
        working-directory: FRONTEND
        run: |
          npm ci --ignore-scripts
          npm run lint
          npm run build

      # Solo corre si creas la variable de repo USE_SONAR=true y los secrets SONAR_TOKEN y SONAR_HOST_URL
      # (SonarCloud o un SonarQube accesible desde internet).
      - name: Análisis SonarQube
        if: ${{ vars.USE_SONAR == 'true' }}
        uses: SonarSource/sonarqube-scan-action@2f77a1ec69fb1d595b06f35ab27e97605bdef703 # v5.3.2
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}